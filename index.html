<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neur Leder — Recrutamento</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1A1A1A;--bg2:#242424;--bg3:#0D0D0D;
  --text:#F0E6D6;--text2:#B89878;--text3:#7A6050;
  --bronze:#C87A28;--bronze-d:#E0922A;--bronze-l:#2A1A0A;
  --border:rgba(200,122,40,0.2);--border2:rgba(200,122,40,0.4);
  --r:10px;--rl:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.wrap{max-width:440px;width:100%;text-align:center}
.logo{margin-bottom:1.5rem}
.logo img{width:110px}
.logo h1{font-size:22px;font-weight:700;color:var(--text);margin-top:10px;letter-spacing:.05em}
.logo p{font-size:13px;color:var(--text2);margin-top:4px}
.divider{width:40px;height:2px;background:var(--bronze);border-radius:2px;margin:1.5rem auto}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.25rem 1.5rem;text-decoration:none;display:flex;align-items:center;gap:16px;transition:all .2s;text-align:left}
.card:hover{border-color:var(--bronze);background:var(--bg2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(200,122,40,0.12)}
.card-icon{width:48px;height:48px;border-radius:var(--r);background:var(--bronze-l);border:0.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon i{font-size:22px;color:var(--bronze)}
.card-info h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.card-info p{font-size:13px;color:var(--text2);line-height:1.4}
.card-arrow{margin-left:auto;color:var(--text3);font-size:18px;flex-shrink:0}
.footer{margin-top:2rem;font-size:12px;color:var(--text3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="logo.png" alt="Neur Leder"/>
    <h1>NEUR LEDER</h1>
    <p>Sistema de Recrutamento</p>
  </div>

  <div class="divider"></div>
  <p class="subtitle">Selecione abaixo como deseja acessar o sistema.</p>

  <div class="cards">
    <a href="candidato.html" class="card">
      <div class="card-icon"><i class="ti ti-clipboard-list"></i></div>
      <div class="card-info">
        <h2>Sou candidato</h2>
        <p>Preencha o formulário de triagem para se candidatar a uma vaga</p>
      </div>
      <i class="ti ti-arrow-right card-arrow"></i>
    </a>

    <a href="login.html" class="card">
      <div class="card-icon"><i class="ti ti-layout-dashboard"></i></div>
      <div class="card-info">
        <h2>Acesso RH</h2>
        <p>Painel restrito para a equipe de recrutamento</p>
      </div>
      <i class="ti ti-arrow-right card-arrow"></i>
    </a>
  </div>

  <div class="footer">© Neur Leder · Sistema de Recrutamento</div>
</div>
</body>
</html>
