<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel RH — Neur Leder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0D0D0D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#1A1A1A;border:0.5px solid rgba(200,122,40,0.3);border-radius:12px;padding:2rem;width:100%;max-width:380px;box-shadow:0 0 40px rgba(200,122,40,0.1)}
.logo{text-align:center;margin-bottom:1.5rem}
.logo img{width:90px;display:block;margin:0 auto 10px}
.logo h1{font-size:20px;font-weight:600;color:#F0E6D6}
.logo p{font-size:13px;color:#B89878;margin-top:4px}
label{display:block;font-size:13px;color:#B89878;margin-bottom:5px;font-weight:500}
input{width:100%;padding:10px 12px;border:0.5px solid rgba(200,122,40,0.4);border-radius:8px;font-size:14px;font-family:inherit;color:#F0E6D6;background:#242424;outline:none;margin-bottom:1rem}
input:focus{border-color:#C87A28;box-shadow:0 0 0 3px rgba(200,122,40,0.15)}
button{width:100%;padding:11px;background:#C87A28;border:none;border-radius:8px;font-size:14px;color:#0D0D0D;cursor:pointer;font-weight:700;font-family:inherit}
button:hover{background:#E0922A}
.erro{display:none;color:#A04040;font-size:13px;margin-bottom:10px;background:#2A0F0F;padding:8px 12px;border-radius:6px}
.dica{font-size:12px;color:#7A6050;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="logo.png" alt="Neur Leder"/>
    <h1>Painel RH</h1>
    <p>Acesso restrito à equipe de recrutamento</p>
  </div>
  <label>Senha de acesso</label>
  <input type="password" id="senha" placeholder="Digite a senha"/>
  <div class="erro" id="erro"><i class="ti ti-alert-circle"></i> Senha incorreta. Tente novamente.</div>
  <button id="btn">Entrar</button>
  
</div>

<script>
const SENHA = 'rh2024';

function login(){
  const val = document.getElementById('senha').value.trim();
  if(val === SENHA){
    window.location.href = 'rh.html';
  } else {
    document.getElementById('erro').style.display = 'block';
    document.getElementById('senha').value = '';
    document.getElementById('senha').focus();
  }
}

document.getElementById('btn').addEventListener('click', login);
document.getElementById('senha').addEventListener('keydown', function(e){
  if(e.key === 'Enter') login();
});
</script>
</body>
</html>
